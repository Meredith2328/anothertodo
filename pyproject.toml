[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anothertodo"
version = "0.1.0"
description = "轻量 todo list：CLI/TUI + 模糊输入 + 提醒 hook + git 同步"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "windows-toasts>=1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# 开发/测试
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
atd = "atd.cli:main"

[tool.setuptools.packages.find]
include = ["atd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
