name: Node build

on:
  workflow_dispatch:
  push:
    tags:
      - "node-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            exe: atd-windows.exe
          - os: macos-latest
            artifact: macos
            exe: atd-macos
          - os: ubuntu-latest
            artifact: linux
            exe: atd-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tools/smoke-node.mjs

      # ---- 独立可执行文件（Node SEA）：无需安装 Node，双击/直接运行即进 TUI ----
      - name: Build SEA bundle
        shell: bash
        run: |
          npm run build:sea
          node --experimental-sea-config sea-config.json
      - name: Inject SEA blob into node binary
        shell: bash
        run: |
          cp "$(command -v node)" "${{ matrix.exe }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --remove-signature "${{ matrix.exe }}"
          fi
          npx postject "${{ matrix.exe }}" NODE_SEA_BLOB dist-sea/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --force --sign - "${{ matrix.exe }}"
          fi
          chmod +x "${{ matrix.exe }}"
      - name: Smoke test executable
        shell: bash
        run: |
          set +e
          output="$("${{ matrix.exe }}" --help 2>&1)"
          code=$?
          echo "$output"
          echo "smoke exit code: $code"
          test "$code" -eq 0 && echo "$output" | grep -q "Usage: atd"

      # ---- 便携 tar 包（面向已装 Node 的环境，npm tarball 之外的裸发行） ----
      - name: Package portable artifact
        shell: bash
        run: |
          mkdir -p release
          cp -R dist-node bin docs README.md package.json package-lock.json release/
          tar -czf "atd-node-${{ matrix.artifact }}.tar.gz" release
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.artifact }}
          path: |
            ${{ matrix.exe }}
            atd-node-${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/atd-windows.exe
            release/atd-macos
            release/atd-linux
            release/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            下载对应平台的独立可执行文件即可使用，无需安装 Node：

            - **Windows**: `atd-windows.exe`（双击或在终端运行，直接进入 TUI）
            - **macOS**: `atd-macos`（`chmod +x atd-macos && ./atd-macos`）
            - **Linux**: `atd-linux`（`chmod +x atd-linux && ./atd-linux`）

            另附面向已安装 Node 22+ 环境的便携包 `atd-node-*.tar.gz`。

            数据与配置仍存放在 `~/.atd`，与 Python 版完全互通。
