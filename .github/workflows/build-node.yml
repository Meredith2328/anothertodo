name: Node build

on:
  workflow_dispatch:
  push:
    tags:
      - "node-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            exe: atd-windows.exe
          - os: macos-15
            artifact: macos
            exe: atd-macos
          - os: ubuntu-latest
            artifact: linux
            exe: atd-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Check release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/node-v* ]]; then
            test "$GITHUB_REF_NAME" = "node-v$(node -p 'require("./package.json").version')"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tools/smoke-node.mjs

      # ---- 独立可执行文件（Node SEA）：无需安装 Node，双击/直接运行即进 TUI ----
      - name: Build SEA bundle
        shell: bash
        run: |
          npm run build:sea
          node --experimental-sea-config sea-config.json
      - name: Inject SEA blob into node binary
        shell: bash
        run: |
          cp "$(command -v node)" "${{ matrix.exe }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --remove-signature "${{ matrix.exe }}"
            # macOS 必须指定 Mach-O 段名，否则 blob 注入位置错误会导致段错误
            npx postject "${{ matrix.exe }}" NODE_SEA_BLOB dist-sea/sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
              --macho-segment-name NODE_SEA
            codesign --force --sign - "${{ matrix.exe }}"
          else
            npx postject "${{ matrix.exe }}" NODE_SEA_BLOB dist-sea/sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          fi
          chmod +x "${{ matrix.exe }}"
      - name: Smoke test executable
        shell: bash
        run: |
          set +e
          output="$(./"${{ matrix.exe }}" --help 2>&1)"
          code=$?
          echo "$output"
          echo "smoke exit code: $code"
          test "$code" -eq 0 && echo "$output" | grep -q "Usage: atd"

      - name: Package Finder app
        if: runner.os == 'macOS'
        shell: bash
        run: bash tools/package-macos-app.sh "${{ matrix.exe }}"

      # ---- 便携 tar 包（面向已装 Node 的环境，npm tarball 之外的裸发行） ----
      - name: Package portable artifact
        shell: bash
        run: |
          mkdir -p release
          cp -R dist-node bin docs README.md package.json package-lock.json release/
          npm ci --omit=dev --prefix release
          tar -czf "atd-node-${{ matrix.artifact }}.tar.gz" release
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.artifact }}
          path: |
            ${{ matrix.exe }}
            atd-node-${{ matrix.artifact }}.tar.gz
            AnotherTodo-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          merge-multiple: true
          path: release
      - name: Write checksums
        run: |
          cd release
          sha256sum atd-windows.exe atd-macos atd-linux atd-node-*.tar.gz AnotherTodo-macos-arm64.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/atd-windows.exe
            release/atd-macos
            release/atd-linux
            release/*.tar.gz
            release/AnotherTodo-macos-arm64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            下载对应平台的独立可执行文件即可使用，无需安装 Node：

            - **Windows**: `atd-windows.exe`（双击或在终端运行，直接进入 TUI）
            - **macOS Apple Silicon**: `AnotherTodo-macos-arm64.zip`（解压后把 `AnotherTodo.app` 放进“应用程序”，双击打开 TUI）；也可直接运行 `atd-macos`。
            - **Linux**: `atd-linux`（`chmod +x atd-linux && ./atd-linux`）

            另附面向已安装 Node 22+ 环境的便携包 `atd-node-*.tar.gz`，解压后在 `release` 目录运行 `node bin/atd.mjs`。

            下载后可用 `SHA256SUMS.txt` 核对文件完整性。

            数据与配置存放在 `~/.atd`，是纯文本 JSONL，格式向后兼容，升级不需要迁移。

            本次改动详见 [CHANGELOG](https://github.com/Meredith2328/anothertodo/blob/${{ github.ref_name }}/CHANGELOG.md)。
