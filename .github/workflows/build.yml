name: build

# 三平台构建：PyInstaller 不能交叉编译，所以 Windows/macOS/Linux 各在自己的
# runner 上构建单文件二进制。push tag（v*）时自动挂到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 需要 contents: write 才能在 tag 时创建/更新 Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: matrix.artifact != 'linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        if: matrix.artifact != 'linux'
        run: python -m pytest tests/ -q

      - name: Build binary
        if: matrix.artifact != 'linux'
        run: python -m PyInstaller atd.spec --noconfirm --clean

      # Build against Ubuntu 20.04 / glibc 2.31 rather than the host's newest
      # glibc. Its shared-library Python lets PyInstaller make a binary usable
      # on Ubuntu 20.04 WSL and similar LTSes.
      - name: Test and build compatible Linux binary
        if: matrix.artifact == 'linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            python:3.10-slim-bullseye /bin/bash -lc '
              apt-get update && apt-get install -y binutils &&
              python -m pip install --upgrade pip &&
              python -m pip install -r requirements.txt pytest pyinstaller &&
              python -m pytest tests/ -q &&
              python -m PyInstaller atd.spec --noconfirm --clean
            '

      # 三个平台产物同名（atd/atd.exe），上传 Release 前按平台重命名防止覆盖
      - name: Rename binary per platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/atd.exe "dist/atd-${{ matrix.artifact }}.exe"
          else
            mv dist/atd "dist/atd-${{ matrix.artifact }}"
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/atd-*

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/atd-*
          fail_on_unmatched_files: false
